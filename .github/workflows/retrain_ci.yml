name: Retrain and Dockerize Model

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 dagshub scikit-learn matplotlib seaborn pandas numpy

    - name: Run MLflow Project (Retrain Model)
      env:
        DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        cd MLProject
        mlflow run . --no-conda

    - name: Login to Docker Hub
      if: ${{ env.DOCKERHUB_USERNAME != '' }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    - name: Build Docker Image from MLflow Model
      run: |
        pip install docker
        mlflow models build-docker -m "MLProject/artifacts/model" -n "albar19/msml-model:latest" --enable-mlserver

    - name: Push Docker Image to Docker Hub
      if: ${{ env.DOCKERHUB_USERNAME != '' }}
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        docker push albar19/msml-model:latest